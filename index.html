
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Router</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #101114;
        color: #e8e8e8;
        font: 14px system-ui, sans-serif;
    }

    main {
        max-width: 440px;
        margin: 50px auto;
        padding: 16px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    h2 { margin: 0; font-size: 21px; }
    h3 { font-size: 14px; margin: 0 0 14px; }

    .card {
        background: #1c1e22;
        border: 1px solid #303238;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 14px;
    }

    .muted { color: #92959d; }
    .green { color: #55cc8a; }

    .status {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
    }

    .network {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 0;
        border-bottom: 1px solid #303238;
        cursor: pointer;
    }

    .network:last-child { border: 0; }
    .network:hover { color: #74a8ff; }

    button, input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        font: inherit;
    }

    input {
        background: #121316;
        border: 1px solid #383b42;
        color: white;
        margin-bottom: 12px;
    }

    button {
        background: #3b82f6;
        color: white;
        border: 0;
        cursor: pointer;
    }

    button:hover { opacity: .85; }

    .secondary {
        background: #30333a;
        margin-top: 10px;
    }

    .danger {
        background: #603137;
        margin-top: 10px;
    }

    .small {
        width: auto;
        padding: 7px 12px;
        background: #30333a;
    }

    .hidden { display: none; }
</style>
</head>
<body>

<main>
    <header>
        <h2>Pi Router</h2>
        <span class="green" id="router-status">● Online</span>
    </header>

    <section class="card">
        <h3>wlan0 / External Wi-Fi</h3>

        <div class="status">
            <span class="muted">Status</span>
            <span id="wifi-status">Disconnected</span>
        </div>

        <div class="status">
            <span class="muted">SSID</span>
            <span id="current-ssid">—</span>
        </div>

        <div class="status">
            <span class="muted">IP Address</span>
            <span id="current-ip">—</span>
        </div>

        <div class="status">
            <span class="muted">Signal</span>
            <span id="current-signal">—</span>
        </div>

        <button class="danger" onclick="disconnect()">
            Disconnect
        </button>
    </section>

    <section class="card">
        <div class="status">
            <h3>Available Networks</h3>
            <button class="small" onclick="scan()">Refresh</button>
        </div>

        <div id="networks">
            <p class="muted">No networks loaded.</p>
        </div>
    </section>

    <section class="card hidden" id="connect-panel">
        <h3>Connect to Network</h3>

        <label class="muted">SSID</label>
        <input id="ssid" type="text" autocomplete="off">

        <label class="muted">Password</label>
        <input id="password" type="password"
               placeholder="Leave empty for open networks">

        <button onclick="connect()">Connect</button>
        <button class="secondary" onclick="hideConnect()">
            Cancel
        </button>
    </section>

    <section class="card">
        <h3>wlan1 / Access Point</h3>

        <div class="status">
            <span class="muted">Interface</span>
            <span>wlan1</span>
        </div>

        <div class="status">
            <span class="muted">Status</span>
            <span id="ap-status">—</span>
        </div>

        <div class="status">
            <span class="muted">SSID</span>
            <span id="ap-ssid">—</span>
        </div>
    </section>
</main>

<script>
    // Backend endpoints to implement later:
    // GET  /api/status
    // GET  /api/scan
    // POST /api/connect    { ssid, password }
    // POST /api/disconnect

    function selectNetwork(ssid) {
        document.getElementById("ssid").value = ssid;
        document.getElementById("password").value = "";
        document.getElementById("connect-panel")
            .classList.remove("hidden");
    }

    function hideConnect() {
        document.getElementById("connect-panel")
            .classList.add("hidden");
    }

    async function scan() {
        const list = document.getElementById("networks");
        list.textContent = "Scanning...";

        try {
            const response = await fetch("/api/scan");
            if (!response.ok) throw Error("Scan failed");

            const networks = await response.json();
            list.replaceChildren();

            for (const network of networks) {
                const item = document.createElement("div");
                item.className = "network";

                const name = document.createElement("span");
                name.textContent = network.ssid;

                const signal = document.createElement("span");
                signal.className = "muted";
                signal.textContent = network.signal + "%";

                item.append(name, signal);
                item.onclick = () => selectNetwork(network.ssid);
                list.appendChild(item);
            }

            if (!networks.length)
                list.textContent = "No networks found.";
        } catch (error) {
            list.textContent = "Unable to scan.";
        }
    }

    async function connect() {
        const ssid = document.getElementById("ssid").value;
        const password = document.getElementById("password").value;

        if (!ssid) return;

        try {
            const response = await fetch("/api/connect", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ssid, password })
            });

            if (!response.ok) throw Error("Connection failed");

            hideConnect();
            await updateStatus();
        } catch (error) {
            alert("Connection failed.");
        }
    }

    async function disconnect() {
        try {
            const response = await fetch("/api/disconnect", {
                method: "POST"
            });

            if (!response.ok) throw Error("Disconnect failed");
            await updateStatus();
        } catch (error) {
            alert("Unable to disconnect.");
        }
    }

    async function updateStatus() {
        try {
            const response = await fetch("/api/status");
            if (!response.ok) return;

            const data = await response.json();

            document.getElementById("wifi-status").textContent =
                data.connected ? "Connected" : "Disconnected";
            document.getElementById("current-ssid").textContent =
                data.ssid || "—";
            document.getElementById("current-ip").textContent =
                data.ip || "—";
            document.getElementById("current-signal").textContent =
                data.signal ?? "—";
            document.getElementById("ap-status").textContent =
                data.ap?.status || "—";
            document.getElementById("ap-ssid").textContent =
                data.ap?.ssid || "—";
        } catch (error) {
            console.error(error);
        }
    }

    updateStatus();
</script>
</body>
</html>
